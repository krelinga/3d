name: image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # This workflow builds the toolchain image every other workflow pins by
    # digest, so it cannot itself run inside that image (see
    # docs/design/initial-design.md, "The image is built from this
    # repository").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/krelinga/openscad-build:latest
            ghcr.io/krelinga/openscad-build:${{ github.sha }}

      - name: Report pinned digest
        run: |
          {
            echo "### Toolchain image pushed"
            echo '```'
            echo "ghcr.io/krelinga/openscad-build@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Update this digest in devcontainer.json and every workflow's \`container:\` key."
          } >> "$GITHUB_STEP_SUMMARY"
