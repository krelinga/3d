name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # for the metrics comment

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # No `container:`. Every step reaches the pinned toolchain through bin/,
    # which is the single place the digest is declared. See
    # docs/design/openscad-image.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # release lookup for the metrics baseline

      # Full builds, not incremental. At this scale incremental is a premature
      # optimization, and building everything is what surfaces a lib/ change
      # that silently moves a dozen parts.
      - name: Validate the catalog
        # catalog-check, not check: `make check` now also verifies the README
        # index, which would make a stale index fail under a step named
        # "Validate the catalog". The narrow targets exist so the failing step
        # names the actual problem.
        run: make catalog-check

      # Before the build, not after: a font that does not resolve makes the
      # part wrong whether or not it builds, and failing here costs seconds
      # instead of a full render of every part.
      - name: Verify fonts resolve
        run: make fonts-check

      - name: Build every part and variant
        run: make -j"$(nproc)"

      # Per-mesh assertions (watertight, winding, volume > 0) run inside
      # tools/metrics.py as part of the build, so a bad mesh has already
      # failed by this point.

      - name: Verify committed thumbnails are fresh
        run: |
          # -B is load-bearing: a fresh checkout gives every file the same
          # mtime, so a plain `make thumbnails` decides the committed PNGs are
          # already current, regenerates nothing, and this check silently
          # passes. That bug shipped once already.
          make -B thumbnails
          if git diff --quiet -- thumbnails/; then
            echo "Thumbnails are current."
            exit 0
          fi
          echo "::error::Thumbnails are stale; run 'make pr' and commit:"
          git diff --name-only -- thumbnails/ | sed 's/^/  /'
          exit 1

      - name: Check the README index is current
        run: make index-check

      # Information, never a gate. Whether a changed volume is acceptable is a
      # judgement for whoever approves the PR, who has this comment in front of
      # them; no threshold could make that judgement instead.
      - name: Metrics diff against the last release
        id: metrics
        continue-on-error: true
        run: |
          mkdir -p baselines
          for part in $(./bin/python3 tools/catalog.py --list); do
            version=$(gh release list --limit 200 --json tagName \
              --jq "[.[] | select(.tagName | startswith(\"$part/v\")) | .tagName] | first" \
              2>/dev/null || true)
            if [ -n "$version" ] && [ "$version" != "null" ]; then
              gh release download "$version" --pattern build-record.json \
                --output "baselines/$part.build-record.json" 2>/dev/null || true
            fi
          done
          {
            echo "## Geometry vs. last release"
            echo ''
            echo '```'
            # --review: same measurement, phrased for someone reviewing a change
            # that has not merged. The post-merge check in main.yml keeps the
            # sharper "your declared version is now dishonest" wording, because
            # there it prompts a decision someone can actually act on.
            ./bin/python3 tools/drift.py --baselines baselines --review \
              --image "$(grep -o 'ghcr.io/[^\"]*' bin/.toolchain-shim)" || true
            echo '```'
          } > metrics-comment.md
          cat metrics-comment.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post the metrics comment
        if: always() && hashFiles('metrics-comment.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('metrics-comment.md', 'utf8');
            const marker = '## Geometry vs. last release';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = existing.data.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - uses: actions/upload-artifact@v4
        with:
          name: meshes
          path: out/
          if-no-files-found: error
