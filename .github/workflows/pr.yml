name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # for the metrics comment

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # No `container:`. Every step reaches the pinned toolchain through bin/,
    # which is the single place the digest is declared. See
    # docs/design/openscad-image.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # release lookup for the metrics baseline

      # Full builds, not incremental. At this scale incremental is a premature
      # optimization, and building everything is what surfaces a lib/ change
      # that silently moves a dozen parts.
      - name: Validate the catalog
        run: make check

      - name: Build every part and variant
        run: make -j"$(nproc)"

      # Per-mesh assertions (watertight, winding, volume > 0) run inside
      # tools/metrics.py as part of the build, so a bad mesh has already
      # failed by this point.

      - name: Verify committed thumbnails are fresh
        run: |
          # Regenerate and compare against what is committed. The comparison
          # needs a pixel tolerance: tessellation is not stable run to run, so
          # byte comparison would be permanently red. See
          # docs/design/initial-design.md.
          make thumbnails
          git diff --name-only -- thumbnails/ > changed.txt
          if [ ! -s changed.txt ]; then
            echo "Thumbnails are byte-identical."
            exit 0
          fi
          # Scratch files must live inside the workspace: bin/ shims bind-mount
          # $PWD, so anything under /tmp is invisible to them.
          mkdir -p .thumbcheck
          stale=""
          limit=$(( 800 * 600 / 200 ))      # 0.5% of pixels
          while read -r f; do
            git show "HEAD:$f" > .thumbcheck/committed.png
            # -metric AE reports the count of differing pixels on stderr.
            diff_px=$(./bin/magick compare -metric AE -fuzz 2% \
              .thumbcheck/committed.png "$f" null: 2>&1 | tr -d '\r' \
              | grep -oE '^[0-9]+' || echo 999999)
            echo "$f: ${diff_px} differing pixels (limit ${limit})"
            if [ "${diff_px:-999999}" -gt "$limit" ]; then stale="$stale $f"; fi
          done < changed.txt
          rm -rf .thumbcheck changed.txt
          if [ -n "$stale" ]; then
            echo "::error::Thumbnails are stale; run 'make thumbnails' and commit:$stale"
            exit 1
          fi
          echo "Differences are within tolerance (tessellation noise)."
          git checkout -- thumbnails/

      - name: Check the README index is current
        run: ./bin/python3 tools/render_index.py --check

      # Information, never a gate. Whether a changed volume is acceptable is a
      # judgement for whoever approves the PR, who has this comment in front of
      # them; no threshold could make that judgement instead.
      - name: Metrics diff against the last release
        id: metrics
        continue-on-error: true
        run: |
          mkdir -p baselines
          for part in $(./bin/python3 tools/catalog.py --list); do
            version=$(gh release list --limit 200 --json tagName \
              --jq "[.[] | select(.tagName | startswith(\"$part/v\")) | .tagName] | first" \
              2>/dev/null || true)
            if [ -n "$version" ] && [ "$version" != "null" ]; then
              gh release download "$version" --pattern build-record.json \
                --output "baselines/$part.build-record.json" 2>/dev/null || true
            fi
          done
          {
            echo "## Metrics vs. last release"
            echo ''
            echo '```'
            ./bin/python3 tools/drift.py --baselines baselines \
              --image "$(grep -o 'ghcr.io/[^\"]*' bin/.toolchain-shim)" || true
            echo '```'
          } > metrics-comment.md
          cat metrics-comment.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post the metrics comment
        if: always() && hashFiles('metrics-comment.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('metrics-comment.md', 'utf8');
            const marker = '## Metrics vs. last release';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = existing.data.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - uses: actions/upload-artifact@v4
        with:
          name: meshes
          path: out/
          if-no-files-found: error
